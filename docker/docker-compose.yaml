services:
  postgres:
    profiles: ["local"]
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-rumluos_db}
      POSTGRES_USER: ${POSTGRES_USER:-rumluos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks: [rumluos]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    image: rumluos-backend:${APP_VERSION:-0.1.0}
    build:
      context: ../rumluos
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      SERVER_PORT: 8080
      APP_VERSION: ${APP_VERSION:-0.1.0}
      SPRING_R2DBC_URL: r2dbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rumluos_db}
      SPRING_R2DBC_USERNAME: ${POSTGRES_USER:-rumluos}
      SPRING_R2DBC_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      SPRING_FLYWAY_URL: jdbc:postgresql://${POSTGRES_HOST:-postgres}:${POSTGRES_PORT:-5432}/${POSTGRES_DB:-rumluos_db}
      SPRING_FLYWAY_USER: ${POSTGRES_USER:-rumluos}
      SPRING_FLYWAY_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      JWT_PRIVATE_KEY: ${JWT_PRIVATE_KEY:?JWT_PRIVATE_KEY is required}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:?JWT_PUBLIC_KEY is required}
      AWS_S3_BUCKET: ${AWS_S3_BUCKET:?AWS_S3_BUCKET is required}
      AWS_S3_PUBLIC_BUCKET_NAME: ${AWS_S3_PUBLIC_BUCKET_NAME:-}
      AWS_S3_REGION: ${AWS_S3_REGION:-ap-southeast-1}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-rumluos-backend}
      OTEL_SDK_DISABLED: ${OTEL_SDK_DISABLED:-false}
      OTEL_TRACES_EXPORTER: ${OTEL_TRACES_EXPORTER:-none}
      OTEL_METRICS_EXPORTER: ${OTEL_METRICS_EXPORTER:-none}
      OTEL_LOGS_EXPORTER: ${OTEL_LOGS_EXPORTER:-none}
      OTEL_METRICS_ENABLED: ${OTEL_METRICS_ENABLED:-false}
      OTEL_TRACES_SAMPLER_ARG: ${OTEL_TRACES_SAMPLER_ARG:-1.0}
      OTEL_METRIC_EXPORT_INTERVAL: ${OTEL_METRIC_EXPORT_INTERVAL:-PT1M}
      GRAFANA_OTLP_URL: ${GRAFANA_OTLP_URL:-}
      GRAFANA_OTLP_AUTH: ${GRAFANA_OTLP_AUTH:-}
    volumes:
      - upload_data:/app/uploads
    networks: [rumluos]
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 45s

  frontend:
    image: rumluos-frontend:${APP_VERSION:-0.1.0}
    build:
      context: ../rumluos-dashboard
      args:
        NEXT_PUBLIC_API_BASE_URL: /api/v1
        NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-0.1.0}
    restart: unless-stopped
    environment:
      API_INTERNAL_URL: http://backend:8080/api/v1
      NEXT_PUBLIC_APP_VERSION: ${APP_VERSION:-0.1.0}
    depends_on:
      backend:
        condition: service_healthy
    networks: [rumluos]

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ../nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ../nginx/certs:/etc/nginx/certs:ro
    depends_on: [frontend, backend]
    networks: [rumluos]

networks:
  rumluos:
    driver: bridge

volumes:
  postgres_data:
  upload_data:
