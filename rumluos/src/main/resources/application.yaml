server:
  port: ${SERVER_PORT:${APP_PORT:8080}}

spring:
  application:
    name: rumluos
  r2dbc:
    url: ${SPRING_R2DBC_URL:r2dbc:postgresql://localhost:54326/rumluos_db}
    username: ${SPRING_R2DBC_USERNAME:postgres}
    password: ${SPRING_R2DBC_PASSWORD:}
    pool:
      initial-size: 5
      max-size: 20
      max-idle-time: 30m
  flyway:
    enabled: ${SPRING_FLYWAY_ENABLED:true}
    url: ${SPRING_FLYWAY_URL:jdbc:postgresql://localhost:54326/rumluos_db}
    user: ${SPRING_FLYWAY_USER:postgres}
    password: ${SPRING_FLYWAY_PASSWORD:${SPRING_R2DBC_PASSWORD:}}
    baseline-on-migrate: true

info:
  app:
    name: ${spring.application.name}
    version: ${APP_VERSION:dev}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  opentelemetry:
    enabled: ${OTEL_SDK_ENABLED:true}
    resource-attributes:
      service.name: ${OTEL_SERVICE_NAME:${spring.application.name}}
      service.version: ${APP_VERSION:dev}
  otlp:
    metrics:
      export:
        enabled: ${OTEL_METRICS_ENABLED:false}
        url: ${GRAFANA_OTLP_METRICS_URL:${GRAFANA_OTLP_URL:http://localhost:4318}/v1/metrics}
        headers:
          Authorization: ${GRAFANA_OTLP_AUTH:}
        step: ${OTEL_METRIC_EXPORT_INTERVAL:PT1M}
  tracing:
    sampling:
      probability: ${OTEL_TRACES_SAMPLER_ARG:1.0}

otel:
  service:
    name: ${OTEL_SERVICE_NAME:${spring.application.name}}
  sdk:
    disabled: ${OTEL_SDK_DISABLED:true}
  traces:
    exporter: ${OTEL_TRACES_EXPORTER:none}
  metrics:
    exporter: ${OTEL_METRICS_EXPORTER:none}
  logs:
    exporter: ${OTEL_LOGS_EXPORTER:none}
  exporter:
    otlp:
      endpoint: ${GRAFANA_OTLP_URL:}
      headers: Authorization=${GRAFANA_OTLP_AUTH:}

logging:
  level:
    root: ${LOG_LEVEL:INFO}
    org.springframework.data.r2dbc: ${R2DBC_LOG_LEVEL:INFO}
    org.flywaydb: INFO

app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS:https://rumluos.menglanghuo.online,http://localhost:4000,http://localhost:5173}

jwt:
  issuer: ${JWT_ISSUER:rumluos-auth}
  audience: ${JWT_AUDIENCE:rumluos-api}
  access:
    expiration: ${JWT_ACCESS_EXPIRATION:1200000}
  refresh:
    expiration: ${JWT_REFRESH_EXPIRATION:604800000}
  keys:
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}

aws:
  region: ${AWS_REGION:${AWS_S3_REGION:ap-southeast-1}}
  s3:
    bucket: ${AWS_S3_BUCKET:}
    public-bucket-name: ${AWS_S3_PUBLIC_BUCKET_NAME:}
    region: ${AWS_S3_REGION:${aws.region}}
    endpoint: ${AWS_S3_ENDPOINT:}
    path-style-access-enabled: ${AWS_S3_PATH_STYLE_ACCESS:false}
    presigned-url-expiration-minutes: ${AWS_S3_PRESIGNED_URL_EXPIRATION_MINUTES:15}
