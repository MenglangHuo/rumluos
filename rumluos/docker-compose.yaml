
services:

  # ═══════════════════════════════════════════════════════════════════════════
  # PostgreSQL 17
  # Plain postgres:17-alpine — no PostGIS, no custom Dockerfile required.
  # ═══════════════════════════════════════════════════════════════════════════
  postgres:
    image: postgres:17-alpine
    container_name: ${APP_PREFIX:-rumluos}-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ${POSTGRES_DB:-rumluos_db}
      POSTGRES_USER:     ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
      PGDATA:            /var/lib/postgresql/data/pgdata
      # Force UTC at DB engine level — critical for global multi-timezone system
      PGTZ:              UTC
      TZ:                UTC
    ports:
      # Bind to localhost only — never expose the DB port publicly
      - "127.0.0.1:${POSTGRES_HOST_PORT:-54326}:5432"
    volumes:
      - rumluos_pgdata:/var/lib/postgresql/data
    networks:
      - rumluos-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-rumluos_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    security_opt:
      - no-new-privileges:true
    logging: &default-logging
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

