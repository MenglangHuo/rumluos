plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.0'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.cloud.tools.jib' version '3.4.3'
}

group = 'com.menglang'
version = System.getenv('APP_VERSION') ?: (project.hasProperty('appVersion') ? project.getProperty('appVersion') : '0.1.0')

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(25)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// WebFlux
	implementation 'org.springframework.boot:spring-boot-starter-webflux'

	// Bean Validation
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Database
	implementation 'org.springframework.boot:spring-boot-starter-data-r2dbc'
	implementation 'org.springframework.boot:spring-boot-starter-jdbc'
	implementation 'org.postgresql:r2dbc-postgresql'

	// Flyway Migration
	implementation 'org.flywaydb:flyway-core'
	runtimeOnly 'org.flywaydb:flyway-database-postgresql'
	runtimeOnly 'org.postgresql:postgresql'

	// Security & JWT
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// AOP & Validation
	implementation 'org.springframework:spring-aop'
	implementation 'org.aspectj:aspectjweaver:1.9.22'
	implementation 'org.springframework.boot:spring-boot-starter-validation'

	// Monitoring
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'io.micrometer:micrometer-registry-otlp'
	implementation 'io.micrometer:micrometer-tracing-bridge-otel'
	implementation 'io.opentelemetry.instrumentation:opentelemetry-spring-boot-starter:2.26.1'

	// OpenAPI / Swagger
	implementation 'org.springdoc:springdoc-openapi-starter-webflux-ui:2.8.8'

	// Lombok
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok-mapstruct-binding:0.2.0'

	// MapStruct
	implementation 'org.mapstruct:mapstruct:1.6.3'
	annotationProcessor 'org.mapstruct:mapstruct-processor:1.6.3'

	// AWS SDK V2
	implementation platform('software.amazon.awssdk:bom:2.27.21')
	implementation 'software.amazon.awssdk:s3'

	// Logging
	implementation 'net.logstash.logback:logstash-logback-encoder:8.0'

	// Jackson
	implementation 'com.fasterxml.jackson.datatype:jackson-datatype-jsr310'

	// Caffeine Cache for High Performance Caching
	implementation 'com.github.ben-manes.caffeine:caffeine:3.1.8'

	// Testing
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'io.projectreactor:reactor-test'
	testImplementation 'org.springframework.security:spring-security-test'

	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.withType(Test).configureEach {
	useJUnitPlatform()
	jvmArgs += ["--enable-native-access=ALL-UNNAMED"]
}

tasks.withType(JavaExec).configureEach {
	jvmArgs += ["--enable-native-access=ALL-UNNAMED"]
}

jib {
	from {
		image = 'eclipse-temurin:25-jre-alpine'
	}
	to {
		image = 'rumluos-app'
		tags = ['latest', project.version.toString()]
	}
	container {
		mainClass = 'com.menglang.rumluos.RumluosApplication'
		jvmFlags = [
			'-XX:InitialRAMPercentage=50.0',
			'-XX:MaxRAMPercentage=75.0',
			'--enable-native-access=ALL-UNNAMED',
			'-Djava.security.egd=file:/dev/./urandom'
		]
		ports = ['8080']
		creationTime = 'USE_CURRENT_TIMESTAMP'
	}
}
