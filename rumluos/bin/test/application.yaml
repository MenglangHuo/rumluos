jwt:
  issuer: rumluos-auth-test
  audience: rumluos-api-test
  access:
    expiration: 1200000
  refresh:
    expiration: 604800000
  keys:
    private-key: ""
    public-key: ""

spring:
  autoconfigure:
    exclude:
      - io.opentelemetry.instrumentation.spring.autoconfigure.OpenTelemetryAutoConfiguration
  r2dbc:
    url: r2dbc:postgresql://localhost:54326/rumluos_db
    username: postgres
    password: ""
  flyway:
    enabled: false
    url: jdbc:postgresql://localhost:54326/rumluos_db
    user: postgres
    password: ""

aws:
  s3:
    bucket: test-bucket
    public-bucket-name: test-public-bucket
    region: us-east-1
    presigned-url-expiration-minutes: 15

otel:
  sdk:
    disabled: true
